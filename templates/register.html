<html>
<head>
    <h1> User Registration Form</h1>
</head>
<body></body>
<li>Please enter your full name.</li>
    <li>Username must contain only letters, numbers, and underscores. No special characters are allowed</li>
    <li>Password must be at least 8 characters long and include both letters and numbers.</li>   
<hr>
    <form method="POST">
    <label>Full Name:</label>
    <input type="text" name="fullname"><br><br>

    <label>Username:</label>
    <input type="text" name="username"><br><br>

    <label>Password:</label>
    <input type="text" name="password"><br><br>

    <label>Confirm Password:</label>
    <input type="text" name="confirm_password"><br><br>

    <button type="submit">Register</button>
    <button type="button" class="btn btn-primary" onclick="history.back()">Back</button>
            

</form>
</body>
</html>
